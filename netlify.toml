# GateCity Buckhead — Netlify configuration
# The site is plain static HTML. Nothing is built on Netlify; the committed
# HTML at the repo root is exactly what gets served.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[build.processing]
  skip_processing = false

# Serve /our-beliefs.html at /our-beliefs, etc.
[[redirects]]
  from = "/home/*"
  to = "/location"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/location"
  status = 301
  force = true

[[redirects]]
  from = "/give"
  to = "https://gatecity-buckhead.churchcenter.com/giving"
  status = 301
  force = true

# Old Squarespace blog IDs -> readable slugs (Oct 30, 2026)
[[redirects]]
  from = "/blog/n247l1ng59nnesgp3hiw7yf9yhk1q6"
  to = "/blog/lent-meeting-jesus-in-the-wilderness"
  status = 301
  force = true

[[redirects]]
  from = "/blog/p6dr10914924t2dyjfxg3cplpsvs7l"
  to = "/blog/left-behind-or-stepping-up-biblical-end-times"
  status = 301
  force = true

[[redirects]]
  from = "/blog/683xhgqhfg1hm1hqgf0v3zr89neet4"
  to = "/blog/the-power-of-presence-strength-in-stillness"
  status = 301
  force = true

[[redirects]]
  from = "/blog/fv4tjkxiujcrgnqs576s570iyos5lb"
  to = "/blog/what-is-the-church"
  status = 301
  force = true

[[redirects]]
  from = "/blog/qzv79kqow9zvlokjr1czzqnxwtkz6v"
  to = "/blog/transformed-part-1-born-again-to-see-the-kingdom"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images cache for a week; CSS/JS are versioned by build.py (?v=hash) so
# they can be revalidated quickly and new styles show up right after deploy.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
