<div class="nl">
<form class="nl-form" action="{{NL_ACTION}}" method="post"{{NL_ATTRS}}>
  {{NL_HIDDEN}}
  <label class="sr-only" for="{{NL_ID}}">Email address</label>
  <input id="{{NL_ID}}" type="email" name="EMAIL" placeholder="you@email.com" required autocomplete="email">
  <button class="btn btn-primary" type="submit">Subscribe <span class="arrow">&rarr;</span></button>
</form>
<p class="nl-fine">No spam, ever. Unsubscribe with one click.</p>
</div>
